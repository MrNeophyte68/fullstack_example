image: node:24-bookworm
stages: [validate]
client:
  stage: validate
  script:
    - cd client
    - npm ci
    - npm run architecture
    - npm run lint
    - npm run build
    - npm test -- --watch=false
server:
  stage: validate
  script:
    - cd server-nestjs
    - npm ci
    - npm run architecture
    - npm run lint
    - npm run build
    - npm test -- --runInBand
