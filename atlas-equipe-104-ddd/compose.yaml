services:
  mongodb:
    image: mongo:8.2
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongodb:27017/hex-atlas
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      PORT: 3000
    depends_on:
      mongodb:
        condition: service_healthy
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api
volumes:
  mongodb-data:
